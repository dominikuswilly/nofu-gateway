# Default server configuration
server {
    listen 8000 default_server;
    listen [::]:8000 default_server;

    root /var/www/html;
    index index.html index.htm index.nginx-debian.html;

    server_name _;

    # Proxy configuration for /api/customer (with timeouts and cache bypass)
    location /api/customer {
        proxy_pass http://192.168.0.110:8090/api/customer;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Prevent caching of sensitive/real-time data
        proxy_cache_bypass $http_upgrade $http_connection;
        proxy_no_cache $http_upgrade $http_connection;

        # Set timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Proxy configuration for /api/product
    location /api/product {
        proxy_pass http://192.168.0.110:8091/api/product;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint (optional)
    location /health {
        return 200 "OK\n";
    }

    # Default catch-all for static files
    location / {
        try_files $uri $uri/ =404;
    }
}
